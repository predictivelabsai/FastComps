services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_PROD: ${DATABASE_URL_PROD}
      DB_SCHEMA: ${DB_SCHEMA:-fast_comps}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-fast_clinic}
      PUBLIC_URL: ${PUBLIC_URL:-https://comps.fastsme.com}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      GROK_MODEL: ${GROK_MODEL:-grok-4-1-fast-non-reasoning}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://comps.fastsme.com/auth/google/callback}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET}
      POSTMARK_API_TOKEN: ${POSTMARK_API_TOKEN:-}
      FROM_EMAIL: ${FROM_EMAIL:-info@fastsme.com}
      PORT: 5063
    expose: ["5063"]
    healthcheck:
      test: ["CMD","curl","--fail","--silent","http://127.0.0.1:5063/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 25s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python","worker.py"]
    environment:
      DATABASE_URL_PROD: ${DATABASE_URL_PROD}
      DB_SCHEMA: ${DB_SCHEMA:-fast_comps}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-fast_clinic}
      FASTCOMPS_WORKER_ENABLED: "true"
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-15}
      EXA_API_KEY: ${EXA_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      GROK_MODEL: ${GROK_MODEL:-grok-4-1-fast-non-reasoning}
      POSTMARK_API_TOKEN: ${POSTMARK_API_TOKEN:-}
      FROM_EMAIL: ${FROM_EMAIL:-info@fastsme.com}
      DAILY_SCAN_ENABLED: ${DAILY_SCAN_ENABLED:-true}
      DAILY_SCAN_HOUR_UTC: ${DAILY_SCAN_HOUR_UTC:-7}
    healthcheck:
      test: ["CMD", "python", "worker_health.py"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 25s
    restart: unless-stopped
